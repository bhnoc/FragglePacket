[package]
name = "fraggle-packet"
version = "0.2.0"
edition = "2021"

[lib]
name = "fraggle_packet"
path = "src/lib.rs"

[[bin]]
name = "fraggle-packet"
path = "main.rs"

[[bin]]
name = "fraggle-desktop"
path = "src/bin/desktop/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
socket2 = "0.5"
libc = "0.2"
colored = "2"
rayon = "1.8"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
log = "0.4"
env_logger = "0.10"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# RustPacketFuzz - Packet crafting and fuzzing
etherparse = "0.15"         # Packet parsing and building
pcap-file = "3.0.0-rc1"     # PCAP file writing (pure Rust) - using 3.0 for better API
thiserror = "1.0"           # Error handling

# HTTPS testing
native-tls = "0.2"          # TLS support for HTTPS testing

# Dioxus Desktop GUI
dioxus = { version = "0.6", features = ["desktop"] }

# File dialogs (cross-platform native)
rfd = "0.15"

# Directories for config paths
dirs = "5.0"

# Async utilities
futures-util = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
users = "0.11"
