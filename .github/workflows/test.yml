name: Test Coverage

on:
  push:
    branches: [ main, 'feature/**', 'feat/**', 'fix/**', 'docs/**' ]
  pull_request:
    branches: [ main, 'feature/**', 'feat/**', 'fix/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test_coverage:
    name: Test and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            pkg-config \
            libssl-dev \
            curl \
            iputils-ping \
            iputils-tracepath \
            traceroute \
            tcpdump \
            dnsutils \
            net-tools \
            iproute2 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      # Formatting and warning-level lints are REPORTED, not enforced: the tree
      # currently carries ~2,200 rustfmt diffs and ~190 clippy warnings. Gating
      # on those today would make every PR red for pre-existing reasons, which
      # trains people to ignore CI. Clippy still fails on hard errors
      # (deny-by-default lints like unused_io_amount) because those are bugs.
      - name: Check formatting (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Run clippy (warnings advisory, errors fail the build)
        run: cargo clippy --all-targets

      # The harness runs target/release/fraggle-packet directly and exits 2 when
      # it is absent (harness/lib.sh require_bin), so build before smoke/acid.
      - name: Build release binaries
        run: cargo build --release

      - name: Run unit and integration tests
        run: |
          cargo test --workspace --all-targets --verbose
          cargo test --workspace --doc --verbose

      - name: Run smoke harness tests
        run: |
          chmod +x ./harness/smoke.sh ./harness/lib.sh
          ./harness/smoke.sh

      # acid.sh is the project's quality ratchet -- "only grows, never shrinks".
      # It must be able to fail the build, so there is no continue-on-error and
      # no `|| echo` swallowing a RED result. Checks that need live network
      # self-skip under FP_HARNESS_OFFLINE, so red here is a real regression.
      - name: Run offline acid harness checks
        run: |
          chmod +x ./harness/*.sh ./harness/checks/*.sh
          FP_HARNESS_OFFLINE=1 ./harness/acid.sh

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate test coverage report
        run: |
          cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage-report
          path: lcov.info
          if-no-files-found: warn

      - name: Write coverage summary to GitHub Step Summary
        run: |
          echo "# Test Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
